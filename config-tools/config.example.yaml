log-level: silent
allow-lan: true
redir-port: 5000
tproxy-port: 5001
find-process-mode: off
unified-delay: true
external-controller: 0.0.0.0:9090
external-ui: ./zash
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist-cdn-fonts.zip"
profile: { store-selected: true }
sniffer: { enable: true, sniff: { HTTP: { ports: [80, 8080] }, TLS: { ports: [443, 8443] } }, skip-dst-address: ['rule-set:telegram@ipcidr'] }
routing-mark: 255
# --- STATIC_DNS:BEGIN --- (при обновлении/переустановке сюда переносится блок dns: из старого config.yaml, если он был; по умолчанию пусто - используется поведение mihomo без своего dns:)
# --- STATIC_DNS:END ---

anchors:
  a1: &domain { type: http, format: mrs, behavior: domain, interval: 86400 }
  a2: &ipcidr { type: http, format: mrs, behavior: ipcidr, interval: 86400 }
  a3: &classical { type: http, format: text, behavior: classical, interval: 86400 }
  a4: &inline { type: inline, behavior: classical }
  http-provider: &http-provider { type: http, interval: 3600, exclude-filter: &geofilter '(?i)Russia|RU|whitelist|Москва|Россия|SPB|MSK|🇷🇺|🇲🇽|🇨🇴|🇦🇷|🇵🇪|🇧🇷|🇮🇳|🇲🇾|🇰🇷|🇯🇵|🇮🇱|🇿🇦|🇦🇺|🇰🇿|🇳🇬|🇨🇱|🇹🇷|🇺🇦|RU-|RU_|Moscow|СПб|Обход' }
  gstatic-health-check: &gstatic-health-check { enable: true, url: "http://www.gstatic.com/generate_204", interval: 300, timeout: 5000, lazy: true }
  sub-names: &sub-names [provider-a, provider-b, provider-c]
  select-default: &select-default { type: select, use: *sub-names, proxies: [DIRECT, 'Заблок. сервисы', '🚀 Авто по пингу', '🛡️Fallback-Stable', '⚙️Manual'] }

proxies:
  # --- STATIC_PROXIES:BEGIN --- (необязательно: свои Hysteria2/AmneziaWG-ноды)
  - name: '🇩🇪 Hysteria2'
    type: hysteria2
    server: proxy-node-1.example.com
    port: 443
    password: "CHANGE_ME"
    obfs: salamander
    obfs-password: "CHANGE_ME"
    sni: proxy-node-1.example.com
    alpn: [h2, http/1.1, h3]
    client-fingerprint: chrome
    udp: true

  - name: '🇳🇱 Hysteria2'
    type: hysteria2
    server: proxy-node-2.example.com
    port: 443
    password: "CHANGE_ME"
    obfs: salamander
    obfs-password: "CHANGE_ME"
    sni: proxy-node-2.example.com
    alpn: [h2, http/1.1, h3]
    client-fingerprint: chrome
    udp: true
  # --- STATIC_PROXIES:END ---

# --- Провайдеры прокси ---
proxy-providers:
  # --- SUBSCRIPTIONS:BEGIN --- (генерируется setup.sh, не редактировать руками)
  provider-a:
    <<: *http-provider
    url: "https://subscription-1.example.com/CHANGE_ME"
    path: ./proxy-providers/provider-a.yaml
    header:
      User-Agent:
        - "v2rayNG/1.8.0"
    health-check: *gstatic-health-check
  provider-b:
    <<: *http-provider
    url: "https://subscription-2.example.com/CHANGE_ME"
    path: ./proxy-providers/provider-b.yaml
    health-check: *gstatic-health-check
  provider-c:
    <<: *http-provider
    url: "https://subscription-3.example.com/CHANGE_ME"
    path: ./proxy-providers/provider-c.yaml
    header:
      User-Agent:
        - "v2rayNG/1.8.0"
    health-check: *gstatic-health-check
  # --- SUBSCRIPTIONS:END ---

  fast:
    type: file
    path: ./fast.yaml
    exclude-type: trojan|ss
    # В fast обычно не больше 20 нод, поэтому минутная проверка допустима.
    # Не копируйте interval: 60 в группы со всеми нодами подписок.
    health-check:
      enable: true
      url: "https://www.gstatic.com/generate_204"
      interval: 60
      timeout: 5000
      lazy: true


# --- Группы прокси ---
proxy-groups:
  # --- Базовые режимы выбора ---
  # Ноды, прошедшие замер реальной скорости в speedtest2.sh.
  # Внутри отобранного пула выбирается нода с минимальной задержкой.
  # Пул маленький (по умолчанию до 20 нод), поэтому interval: 60 безопасен.
  - name: '⚡ Быстрый пул'
    type: url-test
    use: [fast]
    url: "https://www.gstatic.com/generate_204"
    interval: 60
    tolerance: 50
    lazy: true

  # Публичная fallback-группа. Приоритет 1: быстрый пул выше.
  # При недоступности быстрого пула используется 🛡️Fallback-Stable.
  # DIRECT в эту цепочку не входит: если оба выхода не работают,
  # соединения завершаются ошибкой, а не идут напрямую.
  # Проверка может зайти внутрь обеих дочерних групп: не ставьте interval ниже 300;
  # для большого пула рекомендуется 600.
  - name: '⚡ Самые быстрые + Fallback'
    type: fallback
    proxies: ['⚡ Быстрый пул', '🛡️Fallback-Stable']
    url: "https://www.gstatic.com/generate_204"
    interval: 600
    lazy: true

  # Автоматический выбор самого быстрого узла.
  # Берет все прокси из subscription и proxies,
  # проверяет http://www.gstatic.com/generate_204 каждые 600 секунд
  # и выбирает узел с минимальной задержкой.
  # tolerance: 50 снижает частые переключения: если текущий узел
  # медленнее лучшего менее чем на 50 мс, он может остаться выбранным.
  # lazy: true не проверяет узлы, пока группа не выбрана активной -
  # массовая группа не гоняет фоновые проверки, если ей не пользуются.
  # Для полного пула не ставьте interval ниже 300; при 100+ нодах используйте 600.
  - name: '🚀 Авто по пингу'
    type: url-test
    use: *sub-names
    proxies: ['🇩🇪 Hysteria2', '🇳🇱 Hysteria2']
    url: "http://www.gstatic.com/generate_204"
    exclude-filter: *geofilter
    interval: 600
    tolerance: 50
    lazy: true

  # Стабильный резервный выбор.
  # Берет все прокси из subscription и subscription_provider-b,
  # использует первый рабочий узел из списка и держится за него.
  # Если текущий узел перестает проходить проверку доступности,
  # переключается на следующий рабочий.
  # interval: 600 означает проверку доступности каждые 600 секунд.
  # Для полного пула не ставьте interval ниже 300; при 100+ нодах используйте 600.
  - name: '🛡️Fallback-Stable'
    type: fallback
    use: *sub-names
    proxies: ['🇩🇪 Hysteria2', '🇳🇱 Hysteria2']
    url: "http://www.gstatic.com/generate_204"
    exclude-filter: *geofilter
    interval: 600
    lazy: true

  # Ручной выбор узла.
  # В UI можно самостоятельно выбрать конкретный прокси из обоих провайдеров.
  # DIRECT добавляет вариант пустить трафик напрямую, без прокси.
  # Эта группа ничего не выбирает автоматически: используется выбранный вручную пункт.
  - name: '⚙️Manual'
    type: select
    use: *sub-names
    proxies: [DIRECT, '🇩🇪 Hysteria2', '🇳🇱 Hysteria2']

  # Единый режим для всех сервисных групп.
  - name: 'Заблок. сервисы'
    type: select
    proxies: ['⚡ Самые быстрые + Fallback', DIRECT, '🚀 Авто по пингу', '🛡️Fallback-Stable', '⚙️Manual']

  # --- Видео и медиа ---
